name: Pre-release

on:
  push:
    tags:
      - 'v*.*.*-*'   # e.g. v1.1.0-rc1, v1.1.0-beta.2
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Pre-release tag to create/update (e.g. v1.1.0-rc1)'
        required: true

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with:
      sdk_version: ${{ vars.PS5_SDK_VERSION || 'latest' }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact-name }}

      - name: Determine tag name
        id: tagname
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tagname.outputs.tag }}
          name: ${{ steps.tagname.outputs.tag }}
          prerelease: true
          generate_release_notes: true
          files: |
            game-compressor.elf
            game-compressor.elf.sha256
